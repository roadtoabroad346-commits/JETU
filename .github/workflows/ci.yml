name: Phase 04 engineering gates

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx --no-install playwright install --with-deps chromium
      # E2E intentionally runs without Supabase configuration: the app fails
      # closed on missing env, so these checks cover degraded-mode behavior
      # and static contracts only. A run against a real database is a
      # separate, explicitly authorized step.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JETU_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start:database
      - run: npm run db:reset:local
      - run: npm run test:db
      - run: npm run db:reset:local
      - run: npm run test:db
      - run: node scripts/db.mjs advisors
      - run: npm run db:types
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-database-types
          path: src/lib/supabase/database.types.ts
          retention-days: 7
      - run: git diff --exit-code -- src/lib/supabase/database.types.ts
      - run: npm run typecheck
      - run: npm run db:stop
        if: always()

  vault-auth-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JETU_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/db.mjs start-vault-tests
      - run: npx --no-install playwright install --with-deps chromium
      - run: node scripts/vault-auth-test.mjs
      - run: npm run db:stop
        if: always()
